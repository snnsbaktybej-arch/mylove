
<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бир суроом бар ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

       body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background:
        
        url("background.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    overflow: hidden;
    padding: 20px;
}
        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px #00000020;
            position: relative;
            z-index: 2;
        }

        .heart {
            font-size: 65px;
            animation: heartbeat 1.2s infinite;
            margin-bottom: 15px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            color: #d6336c;
            font-size: 27px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 55px;
        }

        button {
            border: none;
            border-radius: 25px;
            padding: 13px 25px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #yesBtn {
            background: #ff4f87;
            color: white;
        }

        #yesBtn:hover {
            background: #e62e6b;
            transform: scale(1.08);
        }

        #noBtn {
            background: #eeeeee;
            color: #555;
        }

        #message {
            display: none;
            margin-top: 25px;
            animation: appear 1s ease;
        }

        #message h2 {
            color: rgb(28, 87, 176);
            font-size: 23px;
            margin-bottom: 20px;
        }

        #nextBtn {
            background: #ff4f87;
            color: white;
            padding: 14px 25px;
            font-size: 16px;
        }

        #nextBtn:hover {
            background: #e62e6b;
            transform: scale(1.07);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .floating-heart {
            position: fixed;
            bottom: -30px;
            color: #ff2f75;
            font-size: 23px;
            animation: fly 5s linear forwards;
            pointer-events: none;
        }

        @keyframes fly {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 15px;
            }

            h1 {
                font-size: 23px;
            }

            #message h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Мени жакшы коросунбу? 🥺</h1>

        <div class="buttons" id="buttons">
            <button id="yesBtn" onclick="sayYes()">Да ❤️</button>
            <button id="noBtn">Нет 🙈</button>
        </div>

        <div id="message">
            <h2>Мен да ушул жоопту күтүп жүргөм ❤️</h2>

            <button id="nextBtn" onclick="goToLetter()">
                Бир сөзүм бар 💌
            </button>
        </div>

    </div>

    <script>
        const noBtn = document.getElementById("noBtn");

        // Нет баскычы качып жүрөт
        function moveButton() {
            noBtn.style.position = "fixed";

            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            const x = Math.random() * Math.max(0, maxX);
            const y = Math.random() * Math.max(0, maxY);

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        noBtn.addEventListener("mouseover", moveButton);
        noBtn.addEventListener("touchstart", function(e) {
            e.preventDefault();
            moveButton();
        });

        noBtn.addEventListener("click", moveButton);

        // Да басылганда билдирүү чыгат
        function sayYes() {
            document.getElementById("buttons").style.display = "none";

            document.getElementById("message").style.display = "block";
        }

        // Экинчи бетке өтүү
        function goToLetter() {
            window.location.href = "letter.html";
        }

        // Учуп жүргөн жүрөктөр
        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "floating-heart";
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (3 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 500);
    </script>

</body>
</html>
